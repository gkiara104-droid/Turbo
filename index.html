<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf0f6">
<title>Turbo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fdf0f6;--ink:#2b1d2e;--mute:#8a7590;--pink:#ec5f9f;--lilac:#b79af0;--card:#fff;--line:#f0dbe8;--cat:#1c1a1f;--ok:#2f9e78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:linear-gradient(160deg,#f1e8ff 0%,#fdf0f6 45%,#ffe3ef 100%) fixed;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:14px 16px}
.serif{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header svg{width:52px;height:52px;border-radius:16px;box-shadow:0 4px 14px #ec5f9f40}
header b{font-size:22px;letter-spacing:-.5px;display:block}
header small{color:var(--mute);font-size:13px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 6px 24px #b79af022}
.hero{background:linear-gradient(135deg,#fff 0%,#fff3fa 100%)}
.lbl{font-size:13px;color:var(--mute);font-weight:600}
.big{font-size:44px;margin:2px 0 4px;letter-spacing:-1px}
.neg{color:var(--pink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.mini{background:#faf3ff;border-radius:14px;padding:10px 12px;font-size:13px}
.mini b{display:block;font-size:17px;margin-top:2px}
.in{color:var(--ok)}.out{color:var(--pink)}
form.q{display:flex;gap:8px}
input,select{font:inherit;color:inherit;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus{border-color:var(--lilac)}
button{font:inherit;border:0;cursor:pointer;border-radius:14px;padding:12px 16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--pink),var(--lilac))}
button.ghost{background:none;color:var(--mute);font-weight:600}
button.soft{background:#fbe6f0;color:var(--pink)}
button.danger{background:none;color:#d94a6a}
.hint{font-size:12px;color:var(--mute);margin:8px 2px 0}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.em{width:40px;height:40px;border-radius:13px;background:#fbe6f0;display:grid;place-items:center;font-size:20px;flex:none}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:15px}
.item .t span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.day{font-size:13px;font-weight:700;color:var(--mute);margin:14px 4px 4px}
.seg{display:flex;background:#f5e7f1;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;background:none;color:var(--mute);padding:9px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0001}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:#fff;border:2px solid var(--line);color:var(--ink);padding:8px 12px;font-weight:600;font-size:14px}
.chip.on{border-color:var(--pink);background:#fff0f7}
.bar{margin:10px 0}.bar .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .tr{height:10px;border-radius:6px;background:#f5e7f1;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pink),var(--lilac))}
.bar.g .tr i{background:linear-gradient(90deg,#7bd8b5,#b79af0)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#ffffffee;backdrop-filter:blur(12px);padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
nav button{background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 14px}
nav button span{font-size:22px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--pink)}nav button.on span{filter:none;opacity:1}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;font-size:30px;padding:0;box-shadow:0 8px 20px #ec5f9f66;z-index:5}
.ov{position:fixed;inset:0;background:#2b1d2e66;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 10px;font-size:19px}
.sheet .amtin{font-size:32px;text-align:center;font-weight:700;border:0;background:#faf3ff}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.nav button{background:#fff;color:var(--ink);padding:8px 14px;box-shadow:0 2px 8px #0001}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--cat);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:20;max-width:90%}
.empty{text-align:center;color:var(--mute);padding:22px 8px;font-size:14px}.empty svg{width:70px;height:70px;border-radius:20px;margin-bottom:8px}
svg text{font-family:system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs"></nav>
<script>
const CAT=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c6dd"/><stop offset="1" stop-color="#d4b8f4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><polygon points="26,52 27,22 47,34" fill="#1c1a1f"/><polygon points="74,52 73,22 53,34" fill="#1c1a1f"/><polygon points="30,44 31,29 41,36" fill="#f28bb5"/><polygon points="70,44 69,29 59,36" fill="#f28bb5"/><ellipse cx="50" cy="58" rx="28" ry="24" fill="#1c1a1f"/><polygon points="50,36 43,60 57,60" fill="#fff"/><ellipse cx="43" cy="72" rx="10" ry="8" fill="#fff"/><ellipse cx="57" cy="72" rx="10" ry="8" fill="#fff"/><ellipse cx="37" cy="56" rx="5" ry="6" fill="#f5d142"/><ellipse cx="63" cy="56" rx="5" ry="6" fill="#f5d142"/><ellipse cx="37" cy="56" rx="1.8" ry="4.5" fill="#1c1a1f"/><ellipse cx="63" cy="56" rx="1.8" ry="4.5" fill="#1c1a1f"/><polygon points="47,66 53,66 50,70" fill="#f28bb5"/><path d="M50 70v3l-4 2M50 73l4 2" stroke="#1c1a1f" stroke-width=".8" fill="none"/><g stroke="#fff" stroke-width=".7"><path d="M34 70L16 66M34 74L16 74M66 70L84 66M66 74L84 74"/></g></svg>`;
const KEY='turbo-v1';
const DEF=[
{n:'Comida',e:'🍕',t:'out',k:'comida cena almuerzo restaurante bar cafe café desayuno pizza burger kebab bocata'},
{n:'Súper',e:'🛒',t:'out',k:'super súper supermercado mercadona lidl carrefour dia aldi'},
{n:'Transporte',e:'🚌',t:'out',k:'taxi bus metro tren uber cabify gasolina bici abono'},
{n:'Ocio',e:'🎮',t:'out',k:'cine fiesta copas disco juego netflix spotify concierto salir'},
{n:'Ropa',e:'👗',t:'out',k:'ropa zara camiseta zapatillas botas vestido sudadera shein'},
{n:'Salud',e:'💊',t:'out',k:'farmacia médico medico dentista gym gimnasio'},
{n:'Estudios',e:'📚',t:'out',k:'libros fotocopias matrícula matricula curso material'},
{n:'Regalos',e:'🎁',t:'out',k:'regalo regalos'},
{n:'Otros',e:'✨',t:'out',k:''},
{n:'Beca',e:'🎓',t:'in',k:'beca becas'},
{n:'Cumpleaños',e:'🎂',t:'in',k:'cumple cumpleaños'},
{n:'Regalo',e:'💌',t:'in',k:'regalo abuela abuelos'},
{n:'Trabajillo',e:'💼',t:'in',k:'trabajo curro clases propina'},
{n:'Otros',e:'✨',t:'in',k:''}];
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>new Date(s+'T00:00:00');
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.tx&&d.cats)return d}catch(e){}return{tx:[],cats:DEF.map(c=>({...c}))}}
let S=load(),view='home',step='month',selB=null,mon=new Date(),sheet=null,toastT;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No pude guardar en este navegador')}};
function toast(m){clearTimeout(toastT);document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);toastT=setTimeout(()=>d.remove(),2400)}
const cat=(n,t)=>S.cats.find(c=>c.n===n&&c.t===t)||{e:'✨',n};
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
const today=()=>ymd(new Date());

/* ---- lógica ---- */
function parse(t){
  const m=t.match(/(\d+(?:[.,]\d{1,2})?)/),amt=m?parseFloat(m[1].replace(',','.')):'';
  const low=t.toLowerCase();
  const type=/^\s*\+|beca|cumple|me (han )?(dieron|dado|ingresaron)|ingreso|regalo de|me pagaron|cobr/.test(low)?'in':'out';
  let w=' '+low.replace(m?m[0]:'','').replace(/[+€]/g,' ')+' ',found=null;
  for(const c of S.cats.filter(c=>c.t===type)){
    if((c.k+' '+c.n.toLowerCase()).split(' ').some(k=>k.length>2&&w.includes(k))){found=c.n;break}
  }
  return{type,amt,cat:found||'Otros',note:t.replace(m?m[0]:'','').replace(/[+€]/g,'').trim(),date:today()};
}
function buckets(){
  const n=step==='day'?14:12,now=new Date(),out=[];
  for(let i=n-1;i>=0;i--){
    let d=new Date(now);
    if(step==='day')d.setDate(d.getDate()-i);
    else if(step==='week')d.setDate(d.getDate()-7*i);
    else d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const k=bk(ymd(d));
    out.push({k,label:step==='month'?MES[d.getMonth()]:step==='day'?d.getDate():pd(k).getDate()+'/'+(pd(k).getMonth()+1)});
  }
  out.forEach(b=>{const tx=S.tx.filter(x=>bk(x.date)===b.k);b.out=sum(tx,'out');b.in=sum(tx,'in')});
  return out;
}
function bk(s){
  if(step==='day')return s;if(step==='month')return s.slice(0,7);
  const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);
}
function bkName(k){
  if(step==='day')return pd(k).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  if(step==='month')return MESL[+k.slice(5,7)-1]+' '+k.slice(0,4);
  const d=pd(k),e=new Date(d);e.setDate(e.getDate()+6);return 'Semana del '+d.getDate()+' '+MES[d.getMonth()]+' al '+e.getDate()+' '+MES[e.getMonth()];
}
function lasts(){ // días que dura el saldo
  const bal=sum(S.tx,'in')-sum(S.tx,'out');if(!S.tx.length)return null;
  const from=new Date();from.setDate(from.getDate()-29);const f=ymd(from);
  const rec=S.tx.filter(x=>x.type==='out'&&x.date>=f);if(!rec.length)return null;
  const first=S.tx.map(x=>x.date).sort()[0],days=Math.min(30,Math.max(1,Math.round((new Date()-pd(first))/864e5)+1));
  const perDay=sum(rec,'out')/days;return{perDay,days:Math.max(0,Math.floor(bal/perDay))};
}
function mood(){
  const mk=today().slice(0,7),tx=S.tx.filter(x=>x.date.startsWith(mk)),i=sum(tx,'in'),o=sum(tx,'out');
  if(!S.tx.length)return'Apunta tu primer movimiento y yo me encargo 🐾';
  if(i>0&&o/i>.9)return'Miau... casi no te queda de lo que entró 🙀';
  if(i>0&&o/i<.5)return'Vas fina este mes, humana 😼';
  return'Yo no juzgo, solo lo pongo encima de la mesa 🐾';
}

/* ---- vistas ---- */
function itemHTML(x){const c=cat(x.cat,x.type);
  return`<div class="item" data-id="${x.id}"><div class="em">${c.e}</div><div class="t"><b>${esc(x.note||x.cat)}</b><span>${x.cat} · ${pd(x.date).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</span></div><div class="amt ${x.type}">${x.type==='in'?'+':'−'}${eur(x.amt).replace('-','')}</div></div>`}
function home(){
  const bal=sum(S.tx,'in')-sum(S.tx,'out'),mk=today().slice(0,7),tx=S.tx.filter(x=>x.date.startsWith(mk)),L=lasts();
  const rec=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,6);
  return`<header>${CAT}<div><b>Turbo</b><small>${mood()}</small></div></header>
  <div class="card hero"><div class="lbl">Saldo disponible</div><div class="big serif ${bal<0?'neg':''}">${eur(bal)}</div>
  <div class="lbl" style="font-weight:500">${L?(L.days>0?`Al ritmo de ${eur(L.perDay)}/día, te dura unos ${L.days} días`:'Al ritmo actual, se acabó 🙀'):'Cuando gastes algo te digo cuánto te dura'}</div>
  <div class="row" style="margin-top:12px"><div class="mini">Entró este mes<b class="in">+${eur(sum(tx,'in'))}</b></div><div class="mini">Se fue este mes<b class="out">−${eur(sum(tx,'out'))}</b></div></div></div>
  <div class="card"><form class="q" id="qf"><input id="qi" placeholder="taxi 15  ·  +beca 300" autocomplete="off"><button>Apuntar</button></form>
  <div class="hint">Escribe o dicta (🎤 del teclado) y confirmas. Con + o “beca” lo cuento como ingreso.</div></div>
  <div class="lbl" style="margin:0 4px">Últimos movimientos</div><div class="card">${rec.length?rec.map(itemHTML).join(''):`<div class="empty">${CAT}<br>Aún nada por aquí. Toca + o escribe arriba.</div>`}</div>`}
function moves(){
  const mk=ymd(mon).slice(0,7),tx=S.tx.filter(x=>x.date.startsWith(mk)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  let h=`<div class="nav"><button data-m="-1">‹</button><b>${MESL[mon.getMonth()]} ${mon.getFullYear()}</b><button data-m="1">›</button></div>
  <div class="row"><div class="mini">Entró<b class="in">+${eur(sum(tx,'in'))}</b></div><div class="mini">Se fue<b class="out">−${eur(sum(tx,'out'))}</b></div></div>`;
  if(!tx.length)return h+`<div class="empty">Nada este mes 🐾</div>`;
  let last='';tx.forEach(x=>{if(x.date!==last){last=x.date;h+=`<div class="day">${pd(x.date).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</div>`}h+=`<div class="card" style="padding:0 14px;margin-bottom:8px">${itemHTML(x)}</div>`});
  return h}
function stats(){
  const B=buckets();if(!selB||!B.find(b=>b.k===selB))selB=B[B.length-1].k;
  const mx=Math.max(1,...B.map(b=>Math.max(b.out,b.in))),W=340,H=140,sl=W/B.length,bw=Math.min(14,sl/2.6);
  let svg=`<svg viewBox="0 0 ${W} ${H+20}" width="100%" role="img" aria-label="Gastos por periodo">`;
  B.forEach((b,i)=>{const x=i*sl,sel=b.k===selB,ho=b.out/mx*(H-14),hi=b.in/mx*(H-14);
    svg+=`<g data-b="${b.k}" style="cursor:pointer"><rect x="${x+1}" y="0" width="${sl-2}" height="${H+20}" rx="8" fill="${sel?'#fbe6f0':'transparent'}"/>
    <rect x="${x+sl/2-bw-1}" y="${H-hi}" width="${bw}" height="${Math.max(hi,b.in?2:0)}" rx="3" fill="#b79af0"/>
    <rect x="${x+sl/2+1}" y="${H-ho}" width="${bw}" height="${Math.max(ho,b.out?2:0)}" rx="3" fill="#ec5f9f"/>
    <text x="${x+sl/2}" y="${H+14}" font-size="9.5" text-anchor="middle" fill="${sel?'#ec5f9f':'#8a7590'}" font-weight="${sel?700:400}">${b.label}</text></g>`});
  svg+='</svg>';
  const tx=S.tx.filter(x=>bk(x.date)===selB),o=sum(tx,'out'),i=sum(tx,'in');
  const grp=(t)=>{const m={};tx.filter(x=>x.type===t).forEach(x=>m[x.cat]=(m[x.cat]||0)+x.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const go=grp('out'),gi=grp('in');
  const bars=(g,t,tot)=>g.map(([n,v])=>`<div class="bar ${t==='in'?'g':''}"><div class="h"><span>${cat(n,t).e} ${n}</span><b>${eur(v)} · ${Math.round(v/tot*100)}%</b></div><div class="tr"><i style="width:${v/tot*100}%"></i></div></div>`).join('');
  let talk='';if(go.length)talk=`${go[0][0]} se llevó el ${Math.round(go[0][1]/o*100)} % de lo que gastaste. ${go[0][1]/o>.4?'Tú verás 😏':'Bien repartido 😼'}`;
  return`<div class="seg">${[['day','Día'],['week','Semana'],['month','Mes']].map(([k,l])=>`<button data-s="${k}" class="${step===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="card">${svg}<div class="hint" style="text-align:center"><span style="color:#b79af0">●</span> entró &nbsp; <span style="color:#ec5f9f">●</span> se fue · toca una barra</div></div>
  <div class="card"><div class="lbl">${bkName(selB)}</div><div class="row" style="margin:8px 0"><div class="mini">Entró<b class="in">+${eur(i)}</b></div><div class="mini">Se fue<b class="out">−${eur(o)}</b></div></div>
  ${talk?`<div class="hint" style="font-size:14px;color:var(--ink)">🐾 ${talk}</div>`:''}</div>
  ${go.length?`<div class="lbl" style="margin:0 4px">Dónde se te fue</div><div class="card">${bars(go,'out',o)}</div>`:`<div class="empty">Sin gastos en este periodo</div>`}
  ${gi.length?`<div class="lbl" style="margin:0 4px">De dónde vino</div><div class="card">${bars(gi,'in',i)}</div>`:''}`}
function settings(){
  const cl=t=>S.cats.filter(c=>c.t===t).map(c=>`<span class="chip">${c.e} ${esc(c.n)} <b data-dc="${esc(c.n)}|${c.t}" style="color:#d94a6a;margin-left:4px">×</b></span>`).join('');
  return`<header>${CAT}<div><b>Ajustes</b><small>Tus datos viven solo en este móvil</small></div></header>
  <div class="card"><b>Nueva categoría</b><div class="row" style="margin-top:10px"><select id="nt"><option value="out">Gasto</option><option value="in">Ingreso</option></select><input id="ne" placeholder="😺" maxlength="2" style="text-align:center;flex:.5"></div>
  <input id="nn" placeholder="Nombre (ej. Mascota)" style="margin:10px 0"><button id="addc" style="width:100%">Añadir categoría</button></div>
  <div class="card"><b>Gastos</b><div class="chips">${cl('out')}</div><b>Ingresos</b><div class="chips">${cl('in')}</div></div>
  <div class="card"><b>Copia de seguridad</b><div class="hint" style="margin-bottom:10px">Descarga tus datos o recupéralos en otro móvil.</div>
  <div class="row"><button class="soft" id="exp">Descargar</button><button class="soft" id="imp">Importar</button></div><input type="file" id="file" accept=".json" hidden>
  <button class="danger" id="wipe" style="width:100%;margin-top:10px">Borrar todo</button></div>`}
function sheetHTML(){
  const s=sheet,cs=S.cats.filter(c=>c.t===s.type);
  return`<div class="ov" id="ov"><div class="sheet"><h3>${s.id?'Editar movimiento':'Confirmámelo y lo guardo 🐾'}</h3>
  <div class="seg"><button data-t="out" class="${s.type==='out'?'on':''}">Gasto</button><button data-t="in" class="${s.type==='in'?'on':''}">Ingreso</button></div>
  <input class="amtin" id="sa" inputmode="decimal" placeholder="0,00 €" value="${s.amt!==''?String(s.amt).replace('.',','):''}">
  <div class="chips">${cs.map(c=>`<button class="chip ${c.n===s.cat?'on':''}" data-c="${esc(c.n)}">${c.e} ${esc(c.n)}</button>`).join('')}</div>
  <div class="row"><input type="date" id="sd" value="${s.date}"><input id="sn" placeholder="Nota (opcional)" value="${esc(s.note)}"></div>
  <button id="ssave" style="width:100%;margin-top:14px">Guardar</button>
  <div class="row"><button class="ghost" id="scan">Cancelar</button>${s.id?'<button class="danger" id="sdel">Eliminar</button>':''}</div></div></div>`}

/* ---- render ---- */
function render(){
  const v={home,moves,stats,settings}[view]();
  $('#app').innerHTML=v+(view==='home'||view==='moves'?'<button class="fab" id="fab" aria-label="Añadir">+</button>':'');
  $('#tabs').innerHTML=[['home','🏠','Inicio'],['moves','🧾','Movimientos'],['stats','📊','Análisis'],['settings','⚙️','Ajustes']].map(([k,i,l])=>`<button data-v="${k}" class="${view===k?'on':''}"><span>${i}</span>${l}</button>`).join('');
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  if(sheet)document.body.insertAdjacentHTML('beforeend',sheetHTML());
}
function readSheet(){if(!sheet)return;const a=$('#sa');if(a)sheet.amt=a.value.replace(',','.');sheet.date=$('#sd').value||today();sheet.note=$('#sn').value}
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);let el;
  if(el=q('[data-v]')){view=el.dataset.v;sheet=null;render();scrollTo(0,0);return}
  if(el=q('[data-m]')){mon=new Date(mon.getFullYear(),mon.getMonth()+ +el.dataset.m,1);render();return}
  if(el=q('[data-s]')){step=el.dataset.s;selB=null;render();return}
  if(el=q('[data-b]')){selB=el.dataset.b;render();return}
  if(q('#fab')){sheet={type:'out',amt:'',cat:'Otros',note:'',date:today()};render();return}
  if(sheet){
    if(el=q('[data-t]')){readSheet();sheet.type=el.dataset.t;sheet.cat='Otros';render();return}
    if(el=q('[data-c]')){readSheet();sheet.cat=el.dataset.c;render();return}
    if(q('#scan')||t.id==='ov'){sheet=null;render();return}
    if(q('#sdel')){S.tx=S.tx.filter(x=>x.id!==sheet.id);save();sheet=null;render();toast('Eliminado');return}
    if(q('#ssave')){readSheet();const a=parseFloat(sheet.amt);if(!(a>0)){toast('Pon una cantidad mayor que 0');return}
      const o={id:sheet.id||Date.now(),type:sheet.type,amt:Math.round(a*100)/100,cat:sheet.cat,note:sheet.note.trim(),date:sheet.date};
      if(sheet.id)S.tx=S.tx.map(x=>x.id===o.id?o:x);else S.tx.push(o);
      save();sheet=null;render();toast(o.type==='in'?'Guardado 💜 qué bien':'Guardado 🐾');return}
    return}
  if(el=q('.item')){const x=S.tx.find(x=>x.id==el.dataset.id);if(x){sheet={...x};render()}return}
  if(el=q('[data-dc]')){const[n,tp]=el.dataset.dc.split('|');if(confirm('¿Borrar la categoría '+n+'? Los movimientos conservan su nombre.')){S.cats=S.cats.filter(c=>!(c.n===n&&c.t===tp));save();render()}return}
  if(q('#addc')){const n=$('#nn').value.trim(),em=$('#ne').value.trim()||'✨',tp=$('#nt').value;if(!n){toast('Ponle un nombre');return}
    if(S.cats.some(c=>c.n===n&&c.t===tp)){toast('Ya existe');return}S.cats.splice(tp==='out'?S.cats.filter(c=>c.t==='out').length-1:S.cats.length-1,0,{n,e:em,t:tp,k:n.toLowerCase()});save();render();toast('Categoría añadida');return}
  if(q('#exp')){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='turbo-'+today()+'.json';a.click();return}
  if(q('#imp')){$('#file').click();return}
  if(q('#wipe')){if(confirm('¿Borrar todos tus movimientos y categorías?')){S={tx:[],cats:DEF.map(c=>({...c}))};save();render();toast('Todo limpio')}return}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='qf'){e.preventDefault();const v=$('#qi').value.trim();if(!v)return;sheet=parse(v);render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tx||!d.cats)throw 0;S=d;save();render();toast('Datos importados')}catch(_){toast('Ese archivo no es de Turbo')}};r.readAsText(f)}
});
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
